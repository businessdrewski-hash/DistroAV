name: Build Receiver Clock Live Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - receiver-clock-downstream-diagnostics

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 diagnostics artifact
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out Receiver Clock Lab
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply live diagnostics source patch
        run: python tools/apply-receiver-clock-live-diagnostics.py

      - name: Verify source patch
        run: |
          python tools/apply-receiver-clock-live-diagnostics.py --check
          git diff --check
          git diff --stat

      - name: Read build identity
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT
          "shortSha=$($env:GITHUB_SHA.Substring(0, 9))" >> $env:GITHUB_OUTPUT

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload standard Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: receiver-clock-live-diagnostics-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ steps.setup.outputs.shortSha }}
          path: release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.zip
          if-no-files-found: error

      - name: Upload portable Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: receiver-clock-live-diagnostics-${{ steps.setup.outputs.pluginVersion }}-windows-x64-portable-${{ steps.setup.outputs.shortSha }}
          path: release-portable/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.zip
          if-no-files-found: error
